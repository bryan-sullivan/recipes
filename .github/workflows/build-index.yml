name: Rebuild recipe index

on:
  push:
    branches: [main]
    paths: ['*.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for per-file added dates

      - name: Build recipes.json from JSON-LD
        run: |
          python3 << 'EOF'
          import json, re, glob, subprocess

          def added_date(f):
              r = subprocess.run(
                  ['git', 'log', '--diff-filter=A', '--follow',
                   '--format=%aI', '-1', '--', f],
                  capture_output=True, text=True)
              return r.stdout.strip()

          items = []
          for f in sorted(glob.glob('*.html')):
              if f in ('index.html', 'recipe-schema-converter.html'):
                  continue
              html = open(f, encoding='utf-8').read()
              m = re.search(
                  r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>',
                  html, re.S)
              if not m:
                  continue
              try:
                  ld = json.loads(m.group(1))
              except json.JSONDecodeError:
                  print(f'skipping {f}: invalid JSON-LD')
                  continue
              if ld.get('@type') != 'Recipe':
                  continue
              tags = [t.strip() for t in ld.get('keywords', '').split(',')
                      if t.strip() and t.strip() != 'recipe']
              items.append({
                  'file': f,
                  'title': ld.get('name', f),
                  'desc': ld.get('description', ''),
                  'cuisine': ld.get('recipeCuisine', ''),
                  'servings': str(ld.get('recipeYield', '')),
                  'tags': tags,
                  'added': added_date(f),
              })
          items.sort(key=lambda r: r['added'])
          with open('recipes.json', 'w', encoding='utf-8') as fp:
              json.dump(items, fp, indent=2, ensure_ascii=False)
          print(f'{len(items)} recipes in manifest')
          EOF

      - name: Commit recipes.json if changed
        run: |
          git config user.name "recipe-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recipes.json
          git diff --cached --quiet || git commit -m "Rebuild recipe index"
          git push
